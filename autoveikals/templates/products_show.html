{% extends "base.html" %}
{% block title %}{{ product["name"] }} - Miniveikals{% endblock %}
{% block content %}
<div class="products-show">
    <img  src="{{ url_for('static', filename='images/products/' ~ product['image']) }}" alt="{{ product['name'] }}">
    
    <div>
        <h2>{{ product["name"] }}</h2>
        <p>{{product['manufacturer']}}</p>
        <p>Cena: {{ product["price"] }} EUR</p>
    </div>
</div>
{% endblock %}
